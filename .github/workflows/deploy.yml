name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Verify branches before they are merged; the deploy job below is skipped.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check and build
        uses: withastro/action@v6
        with:
          node-version: 24
          # Replaces the action's default `npm run build`. `verify` type-checks
          # first, so a type error fails the job before anything is deployed.
          build-cmd: npm run verify
  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
